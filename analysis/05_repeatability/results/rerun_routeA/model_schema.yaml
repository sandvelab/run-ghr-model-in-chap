$schema: https://json-schema.org/draft/2020-12/schema
title: ModelConfiguration for chapkit-ghr-model
type: object
additionalProperties: false
properties:
  user_option_values:
    type: object
    additionalProperties: false
    properties:
      re_spatial:
        default: bym2
        description: How risk varies between areas. 'bym2' (Besag-York-Mollie) lets
          neighbouring areas share information via the adjacency graph, plus an unstructured
          per-area term; 'none' omits the effect. Requires geometry, and is forced
          to 'none' when none is supplied.
        enum:
        - bym2
        - none
        title: Re Spatial
        type: string
      re_seasonal:
        default: rw1
        description: How risk varies within the year, as a cycle (December wraps to
          January). 'rw1' is a random walk that smooths the level between consecutive
          periods; 'rw2' smooths the slope instead, giving a gentler, more curved
          seasonal shape; 'none' omits the effect.
        enum:
        - rw1
        - rw2
        - none
        title: Re Seasonal
        type: string
      re_interannual:
        default: iid
        description: How risk varies between years. 'iid' treats each year as independent,
          which handles year-to-year shocks but cannot extrapolate a trend to an unseen
          year; 'rw1' and 'rw2' assume consecutive years are related and carry a trend
          forward; 'none' omits the effect.
        enum:
        - iid
        - rw1
        - rw2
        - none
        title: Re Interannual
        type: string
      priors:
        default: 0.5:0.01
        description: How much the random effects are allowed to vary, as penalised-complexity
          priors. Each 'U:alpha' pair reads as 'the probability that this effect's
          standard deviation exceeds U is alpha', so '0.5:0.01' says values above
          0.5 are unlikely and keeps the effect conservative. Separate pairs with
          semicolons. The forecast uses the first pair; the selection report searches
          all of them. BSC's Laos demo uses '0.5:0.01;1:0.01'.
        title: Priors
        type: string
      roll_mean:
        default: mean_temperature:3
        description: Rolling-mean windows per covariate, encoded as 'name:w1,w2;name2:w3'.
          Window 1 means no rolling. Empty string disables. Matches select_fe()'s
          roll_mean.
        title: Roll Mean
        type: string
      roll_sum:
        default: rainfall:3
        description: Rolling-sum windows per covariate, same encoding as roll_mean.
          Conventionally used for precipitation.
        title: Roll Sum
        type: string
      lag:
        default: mean_temperature:1;rainfall:1
        description: Lags in periods per covariate, same encoding. Lag 0 means no
          lag. Multiple values put several lagged terms in the one model.
        title: Lag
        type: string
      nl:
        default: ''
        description: Non-linear (random walk) covariate effects, encoded 'name:n'
          where n is the number of basis knots. Empty string means all effects linear.
        title: Nl
        type: string
      standardize:
        default: true
        description: Centre and scale covariates before fitting. Aids INLA convergence.
        title: Standardize
        type: boolean
      family:
        default: nbinomial
        description: INLA likelihood family. 'nbinomial' handles overdispersed counts;
          'poisson' assumes mean equals variance. These are the only two families
          GHRmodel's posterior sampler supports.
        enum:
        - nbinomial
        - poisson
        title: Family
        type: string
      offset:
        default: population
        description: Offset column, entering the linear predictor as log(offset).
          Empty string disables. Modelling rates rather than counts.
        title: Offset
        type: string
      offset_scale:
        default: 10000.0
        description: Divide the offset by this before fitting. BSC's own pipeline
          notes population should be divided by a constant (they use 10,000) to help
          INLA converge. Set to 1 to disable.
        title: Offset Scale
        type: number
      n_samples:
        default: 1000
        description: Posterior predictive draws per forecast row.
        title: N Samples
        type: integer
      nthreads:
        default: 4
        description: INLA compute threads.
        title: Nthreads
        type: integer
      emit_re_selection_report:
        default: false
        description: 'Run BSC''s select_re() random-effect search during training
          and save its HTML comparison report into the training artifact. Covers the
          random-effect stage only, not select_fe(). Expensive: fits many candidate
          models. Does not affect the forecast.'
        title: Emit Re Selection Report
        type: boolean
      report_re_spatial:
        default: bym2
        description: Comma-separated spatial effects for the report search. Forced
          to 'none' when no geometry is supplied.
        title: Report Re Spatial
        type: string
      report_re_seasonal:
        default: rw1,rw2
        description: Comma-separated seasonal effects for the selection report search.
        title: Report Re Seasonal
        type: string
      report_re_interannual:
        default: iid,rw1,rw2
        description: Comma-separated interannual effects for the selection report
          search.
        title: Report Re Interannual
        type: string
    required: []
  additional_continuous_covariates:
    type: array
    items:
      type: string
    default: []
